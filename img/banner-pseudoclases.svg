<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice">
  <rect width="1200" height="400" fill="#F6D8D6"/>
  <circle cx="1080" cy="60" r="140" fill="#F0C5D4"/>
  <circle cx="90" cy="380" r="120" fill="#FCF7D9"/>

  <!-- Ventana de código -->
  <g transform="translate(90 70)">
    <rect width="470" height="260" rx="18" fill="#604734"/>
    <circle cx="30" cy="28" r="7" fill="#F0C5D4"/>
    <circle cx="54" cy="28" r="7" fill="#F6D8D6"/>
    <circle cx="78" cy="28" r="7" fill="#FCF7D9"/>
    <g font-family="Consolas, 'Courier New', monospace" font-size="28" fill="#FCF7D9">
      <text x="34" y="100">button<tspan fill="#F0C5D4">:hover</tspan> {</text>
      <text x="74" y="145">background: <tspan fill="#F0C5D4">pink</tspan>;</text>
      <text x="74" y="190">cursor: <tspan fill="#F0C5D4">pointer</tspan>;</text>
      <text x="34" y="235">}</text>
    </g>
  </g>

  <!-- Botón normal -->
  <g transform="translate(660 110)">
    <text x="0" y="-18" font-family="Arial, sans-serif" font-size="20" fill="#604734">normal</text>
    <rect width="190" height="64" rx="32" fill="#FCF7D9" stroke="#604734" stroke-width="4"/>
    <text x="95" y="41" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#604734">Botón</text>
  </g>

  <!-- Flecha -->
  <path d="M870 142 h60" stroke="#604734" stroke-width="5" stroke-linecap="round"/>
  <path d="M920 128 l16 14 l-16 14" fill="none" stroke="#604734" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Botón en :hover -->
  <g transform="translate(950 110)">
    <text x="0" y="-18" font-family="Arial, sans-serif" font-size="20" fill="#604734">:hover</text>
    <rect width="190" height="64" rx="32" fill="#F0C5D4" stroke="#604734" stroke-width="4"/>
    <text x="95" y="41" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#604734">Botón</text>
    <!-- Cursor -->
    <path d="M120 38 l0 52 l13 -12 l10 22 l9 -4 l-10 -22 l18 0 z" fill="#FCF7D9" stroke="#604734" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <text x="660" y="300" font-family="Georgia, serif" font-size="44" font-style="italic" fill="#604734">selector<tspan fill="#C98BA4">:pseudoclase</tspan></text>
</svg>
