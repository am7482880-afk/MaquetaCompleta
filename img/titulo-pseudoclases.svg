<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Pseudoclases">
  <rect width="1200" height="360" fill="#F6D8D6"/>
  <circle cx="1110" cy="40" r="150" fill="#F0C5D4"/>
  <circle cx="70" cy="340" r="130" fill="#FCF7D9"/>
  <circle cx="1040" cy="300" r="18" fill="#604734"/>
  <circle cx="160" cy="70" r="12" fill="#F0C5D4"/>

  <!-- llaves de código -->
  <text x="40" y="225" font-family="Consolas, 'Courier New', monospace" font-size="150" fill="#F0C5D4">{</text>
  <text x="1080" y="225" font-family="Consolas, 'Courier New', monospace" font-size="150" fill="#F0C5D4">}</text>

  <!-- título -->
  <text x="600" y="185" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="100" letter-spacing="6" fill="#604734">PSEUDOCLASES</text>
  <text x="600" y="245" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="40" fill="#604734">selector<tspan fill="#C98BA4">:pseudoclase</tspan></text>

  <!-- etiquetas -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="24" text-anchor="middle">
    <rect x="360" y="275" width="140" height="44" rx="22" fill="#604734"/>
    <text x="430" y="305" fill="#FCF7D9">:hover</text>
    <rect x="530" y="275" width="140" height="44" rx="22" fill="#604734"/>
    <text x="600" y="305" fill="#FCF7D9">:focus</text>
    <rect x="700" y="275" width="150" height="44" rx="22" fill="#604734"/>
    <text x="775" y="305" fill="#FCF7D9">:checked</text>
  </g>
</svg>
