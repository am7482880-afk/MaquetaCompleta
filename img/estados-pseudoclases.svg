<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Ejemplos de :checked, :focus, :first-child y :disabled">
  <rect width="600" height="400" fill="#F0C5D4"/>
  <circle cx="540" cy="360" r="110" fill="#F6D8D6"/>

  <g font-family="Arial, sans-serif" fill="#604734">
    <!-- :checked -->
    <rect x="50" y="50" width="44" height="44" rx="8" fill="#604734"/>
    <path d="M60 72 l10 10 l18 -20" fill="none" stroke="#FCF7D9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="112" y="82" font-size="28" font-family="Consolas, 'Courier New', monospace">:checked</text>

    <!-- :focus -->
    <rect x="44" y="134" width="300" height="64" rx="14" fill="none" stroke="#FCF7D9" stroke-width="6"/>
    <rect x="50" y="140" width="288" height="52" rx="10" fill="#FCF7D9" stroke="#604734" stroke-width="3"/>
    <rect x="66" y="152" width="3" height="28" fill="#604734"/>
    <text x="362" y="176" font-size="28" font-family="Consolas, 'Courier New', monospace">:focus</text>

    <!-- :first-child -->
    <rect x="50" y="240" width="200" height="34" rx="8" fill="#604734"/>
    <rect x="50" y="284" width="200" height="34" rx="8" fill="#FCF7D9"/>
    <rect x="50" y="328" width="200" height="34" rx="8" fill="#FCF7D9"/>
    <text x="270" y="266" font-size="28" font-family="Consolas, 'Courier New', monospace">:first-child</text>

    <!-- :disabled -->
    <rect x="300" y="300" width="160" height="52" rx="26" fill="#FCF7D9" opacity="0.55" stroke="#604734" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="380" y="334" text-anchor="middle" font-size="22" opacity="0.6">:disabled</text>
  </g>
</svg>